                    items:
                        $ref: '#/components/schemas/Exception'
                closest_matches:
                    type: array
                    nullable: true
                    items:
                        $ref: '#/components/schemas/ClosestMatch'
                portfolio:
                    description: Enriched position records with resolved contract details.
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
            additionalProperties: true

        MarginByCCP:
            type: object
            properties:
                venue_group_code:
                    description: >-
                        Venue group the margin was charged for (e.g. "CBOT", "NYMEX", "ICE.EU").
                        Sits alongside clearing_org, which is unchanged: one clearing house covers
                        several venue groups.
                    type: string
                clearing_org:
                    type: string
                    example: CME
                result_type:
                    type: string
                    example: span2
                currency_code:
                    type: string
                    example: USD
                fxrate:
                    description: >-
                        FX rate used for USD conversion. Null means the rate is unavailable and
                        this row contributes zero to converted aggregates.
                    type: number
                    nullable: true
                    example: 1.0
                initial_margin:
                    type: number
                    example: 1471104.47
                option_liquidation_value:
                    type: number
                    example: 0
                delivery_margin:
                    description: ICE Clear Europe delivery-margin component in row currency.
                    type: number
                    example: 0
                cvm:
                    description: Contingent variation margin component in row currency.
                    type: number
                    example: 0
                sellers_security:
                    description: Seller's security component in row currency.
                    type: number
                    example: 0
                buyers_security:
                    description: Buyer's security component in row currency.
                    type: number
                    example: 0
                cross_model_offset:
                    type: number

        MarginByContract:
            type: object
            properties:
                venue_group_code:
                    description: >-
                        Venue group the margin was charged for (e.g. "CBOT", "NYMEX", "ICE.EU").
                        Sits alongside clearing_org, which is unchanged: one clearing house covers
                        several venue groups.
                    type: string
                clearing_org:
                    type: string
                    example: CME
                result_type:
                    type: string
                    example: span2
                exchange:
                    type: string
                    example: CME
                cc_code:
                    type: string
                    example: NY-BZ
                cc_name:
                    type: string
                    example: Brent Crude Oil
                sector:
                    type: string
                    example: Energy
                sub_sector:
                    type: string
                    example: Oil
                currency_code:
                    type: string
                    example: USD
                fxrate:
                    description: >-
                        FX rate used for USD conversion. Null means the rate is unavailable and
                        this row contributes zero to converted aggregates.
                    type: number
                    nullable: true
                    example: 1.0
                initial_margin:
                    type: number
                    example: 1471104.47
                option_liquidation_value:
                    type: number
                    example: 0
                delivery_margin:
                    description: ICE Clear Europe delivery-margin component in row currency.
                    type: number
                    example: 0
                cvm:
                    description: Contingent variation margin component in row currency.
                    type: number
                    example: 0
                sellers_security:
                    description: Seller's security component in row currency.
                    type: number
                    example: 0
                buyers_security:
                    description: Buyer's security component in row currency.
                    type: number
                    example: 0

        IrmDeliveryMarginByContract:
            type: object
            properties:
                result_type:
                    type: string
                    example: irm2_3
                clearing_org:
                    type: string
                    example: ICE.EU
                currency_code:
                    description: Engine/result currency.
                    type: string
                    example: USD
                delivery_currency_code:
                    description: Raw component currency before conversion.
                    type: string
                    example: EUR
                exchange:
                    type: string
                    example: ICE.EU
                contract_code:
                    type: string
                    example: B
                contract_name:
                    type: string
                    example: Brent Crude Oil
                sector:
                    type: string
                    example: Energy
                sub_sector:
                    type: string
                    example: Oil
                delivery_margin:
                    description: Raw ICE Clear Europe delivery-margin component.
                    type: number
                    example: 0
                cvm:
                    description: Raw contingent variation margin component.
                    type: number
                    example: 0
                sellers_security:
                    description: Raw seller's security component.
                    type: number
                    example: 0
                buyers_security:
                    description: Raw buyer's security component.
                    type: number
                    example: 0

        MarginBySpan:
            type: object
            properties:
                clearing_org:
                    type: string
                    example: CME
                result_type:
                    type: string
                    example: span
                exchange:
                    type: string
                    example: CME
                cc_code:
                    type: string
                    example: NY-BZ
                cc_name:
                    type: string
                    example: Brent Crude Oil
                scenario:
                    type: string
                    example: '13'
                currency_code:
                    type: string
                    example: USD
                fxrate:
                    type: number
                    example: 1.0
                initial_margin:
                    type: number
                    example: 1471104.47
                scanning_risk:
                    type: number
                    example: 1471104.47
                prompt_date_charge:
                    type: number
                    example: 0
                intra_spread_charge:
                    type: number
                    example: 0
                short_option_charge:
                    type: number
                    example: 0
                intercontract_credit:
                    type: number
                    example: 0
                strategy_spread_charge:
                    type: number
                    example: 0
                option_liquidation_value:
                    type: number
                    example: 0

        Exception:
            type: object
            properties:
                position_id:
                    type: string
                    example: '5'
                engine:
                    type: string
                    example: validation
                exception:
                    type: string
                    example: 'Invalid `expiry` on position ICE.EU | B | FUT | 202501 | 0'

        ClosestMatch:
            type: object
            properties:
                position_id:
                    type: string
                    example: '5'
                engine:
                    type: string
                    example: validation
                exception:
                    type: string
                    example: 'Applied closest matching expiry on position ICE.EU | B | FUT | 20250300 | 0'

        SyncResponse:
            description: Synchronous response containing margin results.
            type: object
            properties:
                request_id:
                    type: string
                    example: '5c09862d8d690f8d821b47762ef06a6f'
                username:
                    type: string
                    example: 'user@cumulus9.com'
                status:
                    type: string
                    enum: [success, failed, loading]
                    example: success
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/AccountResult'
                runtime:
                    description: Processing time in milliseconds.
                    type: integer
                    example: 114
                parameters:
                    description: Margin model parameters used in the calculation.
                    type: object
                    additionalProperties: true
                memo:
                    type: string
                error:
                    type: object
                    additionalProperties: true

        BatchAccepted:
            description: Response when a batch job is accepted.
            type: object
            properties:
                batch_id:
                    description: UUID to poll for status.
                    type: string
                    format: uuid
                    example: 'a1b2c3d4-e5f6-7890-abcd-ef1234567890'

        BatchStatus:
            description: Status of a batch job.
            type: object
            properties:
                batch_id:
                    type: string
                    format: uuid
                status:
                    type: string
                    enum: [queued, processing, completed, failed, completed_with_errors]
                    example: processing
                queue_position:
                    description: Position in queue (present only when status is `queued`).
                    type: integer
                created_at:
                    description: ISO 8601 submission timestamp.
                    type: string
                    format: date-time
                completed_at:
                    description: ISO 8601 completion timestamp (null while in progress).
                    type: string
                    format: date-time
                    nullable: true
                runtime_ms:
                    description: Elapsed time in milliseconds.
                    type: integer
                completed_pct:
                    description: Completion percentage (0-100).
                    type: number
                request_ids:
                    description: >-
                        The IDs this batch's results are stored under, one per chunk.
                        Present only once status is terminal (completed,
                        completed_with_errors or failed). Needed only for the
                        `GET /results` drill-down; for the batch's account figures use
                        `GET /portfolios/batch/{batch_id}/results`.
                    type: array
                    items:
                        type: string
                        format: uuid

        BatchResults:
            description: Account-level results for one batch.
            type: object
            properties:
                batch_id:
                    type: string
                    format: uuid
                status:
                    description: The batch's status, as reported by the poll endpoint.
                    type: string
                total:
                    description: >-
                        Accounts in the whole batch, before limit and offset. Page until
                        offset plus the length of `results` reaches this.
                    type: integer
                    example: 1284
                limit:
                    type: integer
                offset:
                    type: integer
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/BatchResultRow'

        BatchResultRow:
            description: One account's figures from a batch.
            type: object
            properties:
                account_code:
                    type: string
                    example: 'Account 001'
                portfolio_id:
                    description: 'md5(account_code), or md5(account_code + sub_account_code).'
                    type: string
                    example: '12a09fb7c8e61a6a7201938225ce71e9'
                request_id:
                    description: Pass to `GET /results` with portfolio_id for this account's drill-down.
                    type: string
                    format: uuid
                submitted_time:
                    type: string
                    format: date-time
                status:
                    description: >-
                        Calculation state of the account: live, static, warning, failed or
                        loading. Null on a row read from the durable record.
                    type: string
                    nullable: true
                source:
                    description: >-
                        `live` means the account still carries this batch's calculation and
                        every field below is populated. `history` means a later calculation
                        has replaced its current figures, so requirement, gross_margin and
                        gross_requirement come back null rather than as a misleading zero.
                    type: string
                    enum: [live, history]
                initial_margin:
                    type: number
                    nullable: true
                requirement:
                    type: number
                    nullable: true
                gross_margin:
                    type: number
                    nullable: true
                gross_requirement:
                    type: number
                    nullable: true
                option_liquidation_value:
                    type: number
                    nullable: true
                additional_margin:
                    type: number
                    nullable: true
                value_at_risk:
                    type: number
                    nullable: true
                stress_loss:
                    type: number
                    nullable: true
                exceptions:
                    type: number
                    nullable: true
                closest_matches:
                    type: number
                    nullable: true

        StressScenarioInput:
            type: object
            required: [scenario_name, scenario_definition]
            properties:
                scenario_id:
                    description: Omit to create a new scenario. Supply a caller-owned ID to replace it.
                    type: string
                    format: uuid
                scenario_name:
                    type: string
                scenario_definition:
                    $ref: '#/components/schemas/StressScenarioDefinition'

        StressScenario:
            type: object
            required: [scenario_id, scenario_name, scenario_definition]
            properties:
                scenario_id:
                    type: string
                    format: uuid
                scenario_name:
                    type: string
                scenario_definition:
                    $ref: '#/components/schemas/StressScenarioDefinition'
                built_in:
                    description: True when the scenario is supplied by Cumulus9 and cannot be deleted by the caller.
                    type: boolean
            additionalProperties: true

        StressScenarioDefinition:
            description: |
                Hierarchical shocks. The most specific match wins in this order:
                expiry, underlying, sub_sector, sector.
            type: object
            properties:
                sector:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/StressShock'
                sub_sector:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/StressShock'
                underlying:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/StressShock'
                expiry:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/StressShock'

        StressShock:
            type: object
            properties:
                override:
                    type: boolean
                    default: false
                underlying:
                    description: Decimal price shock, for example -0.10 for minus 10 percent.
                    type: number
                volatility:
                    description: Decimal volatility shock, for example 0.20 for plus 20 percent.
                    type: number
            additionalProperties: false

        EventMarketContract:
            type: object
            required: [ticker, label, event_ticker, status]
            properties:
                ticker:
                    type: string
                label:
                    type: string
                event_ticker:
                    type: string
                status:
                    type: string
                    example: active
                expiration_time:
                    type: string
                    format: date-time
                    nullable: true
                mark_dollars:
                    type: number
                    nullable: true
                mark_source:
                    type: string

        EventMarketSearchResponse:
            type: object
            required: [count, markets]
            properties:
                catalog_version:
                    type: string
                    nullable: true
                count:
                    type: integer
                markets:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventMarketContract'

        EventMarketContractsResponse:
            type: object
            required: [count, contracts]
            properties:
                parameter_version:
                    type: string
                    nullable: true
                count:
                    type: integer
                contracts:
                    type: array
                    items:
                        $ref: '#/components/schemas/EventMarketContract'

        StagePortfolioRequest:
            type: object
            required: [type, data, idx, errors]
            properties:
                type:
                    description: Loader type. The public What-If example uses etd.
                    type: string
                    enum: [etd, fi, fi_by_cusip, fx, crif, irs, ladder, events]
                data:
                    description: Tabular loader rows. ETD row order is line ID, account code, exchange, contract, type, expiry, strike, net position, account type.
                    type: array
                    items:
                        type: array
                        items: {}
                idx:
                    description: Zero-based indexes of the submitted rows.
                    type: array
                    items:
                        type: integer
                errors:
                    description: Existing loader error coordinates. Use an empty array for a new stage.
                    type: array
                    items:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items:
                            type: integer
                vendor_symbology:
                    type: string
                    enum: [clearing, ion, gmi, tt_new]
                    default: clearing
                cme_symbology:
                    type: string
                    enum: [clearing, globex]
                    default: clearing
                use_closest_match:
                    type: boolean
                    default: false
                use_closest_active:
                    type: boolean
                    default: false

        StagePortfolioResponse:
            type: object
            required: [request_id, data, errors]
            properties:
                request_id:
                    type: string
                    format: uuid
                data:
                    type: array
                    items:
                        type: array
                        items: {}
                errors:
                    type: array
                    items:
                        type: array
                        items:
                            type: integer

        WhatIfRequest:
            type: object
            required: [action, request_id, portfolio_id]
            properties:
                action:
                    type: string
                    enum: [what-if]
                request_id:
                    description: Request ID of the stored baseline calculation.
                    type: string
                    format: uuid
                portfolio_id:
                    description: Portfolio ID of the baseline account.
                    type: string
                calculation_type:
                    type: string
                    default: all
                risk_free_rate:
                    type: number

        WhatIfResponse:
            type: object
            required: [what_if]
            properties:
                what_if:
                    type: object
                    required: [summary, margin_by_contract, portfolio]
                    properties:
                        summary:
                            type: object
                            additionalProperties: true
                        margin_by_contract:
                            type: array
                            items:
                                type: object
                                additionalProperties: true
                        portfolio:
                            type: array
                            items:
                                type: object
                                additionalProperties: true

        BadRequestError:
            type: object
            properties:
                error:
                    type: string
                    example: Invalid request body

        UnauthorizedError:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        message:
                            type: string
                            example: 'Invalid or expired API key'

        RateLimitedError:
            type: object
            properties:
                error:
                    type: string
                    example: Rate limit exceeded

        InternalServerError:
            type: object
            properties:
                error:
                    type: string
                    example: Internal Server Error

    responses:
        SyncResults:
            description: Successful synchronous response
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SyncResponse'
        BadRequest:
            description: Bad Request (400)
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BadRequestError'
        Unauthorized:
            description: Unauthorized (401)
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UnauthorizedError'
        RateLimited:
            description: Too Many Requests (429)
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RateLimitedError'
        InternalServerError:
            description: Internal Server Error (500)
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/InternalServerError'
        StringList:
            description: A list of available values.
            content:
                application/json:
                    schema:
                        type: array
                        items:
                            type: string
        ReferenceObject:
            description: Reference values accepted by this position type.
            content:
                application/json:
                    schema:
                        type: object
                        additionalProperties: true
        EventMarketNotLicensed:
            description: Event markets are not enabled on the caller's licence.
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: object
                                properties:
                                    code:
                                        type: string
                                        example: EVENT_MARKET_NOT_LICENSED
                                    message:
                                        type: string

    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: API key (sk-... prefix) provided as a Bearer token.

security:
    - bearerAuth: []
