                margin_by_dce:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_shfe:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_zce:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_cmerates:
                    description: CME cleared-rates margin, engine detail, and net ladder.
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_events:
                    description: Event-market margin by event contract.
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                event_risk:
                    description: Event VaR, expected shortfall, stress, scenarios, probability shocks, and coverage.
                    type: object
                    nullable: true
                    additionalProperties: true
                risk_components:
                    description: Reconciliation of event and conventional risk components.
                    type: object
                    nullable: true
                    additionalProperties: true
                pnl_vector:
                    type: array
                    nullable: true
                    items:
                        type: array
