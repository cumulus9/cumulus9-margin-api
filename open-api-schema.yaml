openapi: '3.0.0'
info:
    version: 'v1.0'
    title: 'Cumulus9 Margin API'
    description: |
        The Cumulus9 Margin API calculates initial margin requirements across all major clearing houses.
        Supports SPAN, SPAN2, PRISMA, TIMS, NODAL VaR, IRM 2.0, JPX VaR, KRX, B3 Core, and ISDA SIMM.

        ## Authentication
        Use your API key (`sk-...` prefix) as a Bearer token in the `Authorization` header for all requests.

        ## Getting Started
        1. Obtain `C9_API_ENDPOINT` and `C9_API_SECRET` from support@cumulus9.com.
        2. POST a portfolio payload to `/portfolios` for synchronous results.
        3. For large workloads, POST to `/portfolios/batch`, poll status, then read each
           `request_id` the finished batch reports back through `/results`.
    contact:
        email: support@cumulus9.com
        url: https://cumulus9.com
    license:
        name: MIT
        url: https://opensource.org/license/mit
tags:
    - name: portfolios
      description: Submit portfolios and calculate margin requirements
    - name: batch
      description: Batch processing for large portfolios
    - name: results
      description: Read back the results of a completed calculation
    - name: stress-scenarios
      description: Manage reusable stress-test scenarios
    - name: validation-reference
      description: Discover valid public contract values and validate portfolios
    - name: event-markets
      description: Discover licensed event-market contracts
    - name: what-if
      description: Stage a changed portfolio and compare it with a stored result
servers:
    - url: 'https://{host}'
      description: Your Cumulus9 API endpoint
      variables:
          host:
              default: staging.api.cumulus9.com
              description: Host issued with your API credentials.
paths:
    /portfolios:
        post:
            summary: Calculate portfolio margin
            description: |
                Submit a multi-account, multi-exchange portfolio and receive margin requirements,
                analytics, and SIMM calculations synchronously.
                Supports ETD, Fixed Income, FX, Fixed Income by CUSIP, CRIF, event,
                cleared IRS, and rates delta-ladder position types.
            operationId: calculateMargin
            tags:
                - portfolios
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PortfolioRequest'
                        examples:
                            etd_margins:
                                summary: ETD margin calculation
                                value:
                                    calculation_type: margins
                                    vendor_symbology: clearing
                                    portfolio:
                                        - account_code: Account 001
                                          exchange_code: ICE.EU
                                          contract_code: B
                                          contract_type: FUT
                                          contract_expiry: 'DEC-27'
                                          net_position: '100'
                                          account_type: H
                            simm_calculation:
                                summary: ISDA SIMM calculation
                                value:
                                    calculation_type: simm
                                    simm_metrics:
                                        version: '2_6_5'
                                        holding_period: 10
                                    portfolio:
                                        - account_code: Fund ABC
                                          product_class: RatesFX
                                          risk_type: Risk_IRCurve
                                          qualifier: USD
                                          bucket: '1'
                                          label1: 15Y
                                          label2: OIS
                                          amount_usd: 1000000
                            bond_analytics:
                                summary: Fixed income analytics
                                value:
                                    calculation_type: analytics
                                    risk_metrics:
                                        lookback: 250
                                        ci: 99
                                        method: value-at-risk
                                        mpor: 1
                                        mode: absolute
                                    portfolio:
                                        - account_code: Account 001
                                          currency: USD
                                          contract_type: BOND
                                          maturity: '20461021'
                                          coupon_rate: 6
                                          coupon_frequency: 2
                                          notional: 1000000
                            fx_position:
                                summary: FX margin calculation
                                value:
                                    calculation_type: margins
                                    portfolio:
                                        - account_code: Account 001
                                          currency_pair: EUR_USD
                                          contract_type: FX
                                          expiry: '20271231'
                                          amount: 5000000
            responses:
                '200':
                    $ref: '#/components/responses/SyncResults'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: An event-market exchange in the portfolio is not enabled on the caller's licence.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /portfolios/optimize:
        post:
            summary: Optimize CME rates cross margin
            description: |
                Compare listed and cleared-rates margin allocations and return the lowest-margin
                allocation found. Use the standard portfolio request with trade-level cleared IRS
                positions or a rates delta ladder. At least one eligible CME listed-rates future
                must set `cross_margin` to `true`. The cmerates engine must be enabled on the
                client's licence.
            operationId: optimizeCmeRatesCrossMargin
            tags:
                - portfolios
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PortfolioRequest'
            responses:
                '200':
                    description: Cross-margin optimization completed.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OptimizerResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: The cmerates engine is not enabled on this licence.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                '413':
                    description: The request exceeds the maximum payload size.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                '422':
                    description: An account exceeds its position limit.
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                '429':
                    $ref: '#/components/responses/RateLimited'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /portfolios/batch:
        post:
            summary: Submit batch portfolio
            description: |
                Submit a large portfolio for background processing. Accepts the same payload as
                `POST /portfolios`. The portfolio is automatically chunked and processed with
                progress tracking.
            operationId: submitBatch
            tags:
                - batch
            parameters:
                - name: x-processing-mode
                  in: header
                  required: false
                  description: |
                      Queue behavior for the batch job.
                      - `fifo`: First-in, first-out (default)
                      - `priority`: Priority queue promotion
                      - `replace_all`: Clear all queued batches for this user before adding
                  schema:
                      type: string
                      enum: [fifo, priority, replace_all]
                      default: fifo
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PortfolioRequest'
            responses:
                '202':
                    description: Batch accepted for processing
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchAccepted'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '413':
                    description: Payload Too Large (exceeds 500 MB)
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /portfolios/batch/{batch_id}:
        get:
            summary: Poll batch status
            description: Retrieve the status and progress of a batch job.
            operationId: getBatchStatus
            tags:
                - batch
            parameters:
                - name: batch_id
                  in: path
                  required: true
                  description: The `batch_id` returned from `POST /portfolios/batch`.
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: Batch status
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchStatus'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /portfolios/batch/{batch_id}/results:
        get:
            summary: Fetch a whole batch's results
            description: |
                Every account the batch calculated, in one call, with its account-level
                figures.

                A batch is split into chunks whose sizes are chosen from engine response
                sizes and worker memory, so the same portfolio may be three chunks today
                and forty tomorrow. This endpoint answers at the level the caller
                submitted. For the full calculation detail of a single account, follow up
                with `GET /results`.
            operationId: getBatchResults
            tags:
                - batch
            parameters:
                - name: batch_id
                  in: path
                  required: true
                  description: The `batch_id` returned from `POST /portfolios/batch`.
                  schema:
                      type: string
                      format: uuid
                - name: limit
                  in: query
                  required: false
                  description: Maximum accounts to return. Capped at 20000.
                  schema:
                      type: integer
                      default: 5000
                      maximum: 20000
                - name: offset
                  in: query
                  required: false
                  description: Accounts to skip, for paging through a large book.
                  schema:
                      type: integer
                      default: 0
            responses:
                '200':
                    description: The batch's account results
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BatchResults'
                '400':
                    description: limit or offset was not a number
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /results:
        get:
            summary: Fetch stored calculation results
            description: |
                Return the stored results of a completed calculation.

                `POST /portfolios/batch` splits a portfolio into chunks and calculates each
                under its own `request_id`; the finished batch status lists them in
                `request_ids`. Call this endpoint once per id to collect the whole batch.
            operationId: getResults
            tags:
                - results
            parameters:
                - name: request_id
                  in: query
                  required: true
                  description: A `request_id` reported by `GET /portfolios/batch/{batch_id}`.
                  schema:
                      type: string
                      format: uuid
                - name: portfolio_id
                  in: query
                  required: false
                  description: >-
                      Restrict the response to one account: `md5(account_code)`, or
                      `md5(account_code + sub_account_code)` for a sub-account. Omit to get
                      every account calculated under this `request_id`.
                  schema:
                      type: string
            responses:
                '200':
                    description: Account results. Empty when the caller does not own the request.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/AccountResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /results/accounts:
        get:
            summary: Fetch the latest live result for each account
            description: |
                Return one summary row per live account visible to the authenticated caller.
                This is current book state, not the results of a specific batch.
            operationId: getAccountResults
            tags:
                - results
            responses:
                '200':
                    description: Latest live account summaries.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/AccountResult'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /stress-test/scenarios:
        get:
            summary: List stress-test scenarios
            description: Return the built-in and caller-owned scenarios available to the authenticated caller.
            operationId: listStressTestScenarios
            tags:
                - stress-scenarios
            responses:
                '200':
                    description: Available scenarios.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/StressScenario'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        post:
            summary: Create or replace stress-test scenarios
            description: Create caller-owned scenarios. Supply an existing caller-owned scenario_id to replace it.
            operationId: createStressTestScenarios
            tags:
                - stress-scenarios
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: array
                            minItems: 1
                            items:
                                $ref: '#/components/schemas/StressScenarioInput'
            responses:
                '200':
                    description: IDs of the created or replaced scenarios.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [scenario_ids]
                                properties:
                                    scenario_ids:
                                        type: array
                                        items:
                                            type: string
                                            format: uuid
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'
        delete:
            summary: Delete a stress-test scenario
            description: Delete one caller-owned scenario. Built-in scenarios are not affected.
            operationId: deleteStressTestScenario
            tags:
                - stress-scenarios
            parameters:
                - name: scenario_id
                  in: query
                  required: true
                  schema:
                      type: string
                      format: uuid
            responses:
                '200':
                    description: The deleted scenario ID.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [scenario_id]
                                properties:
                                    scenario_id:
                                        type: string
                                        format: uuid
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalServerError'

    /validation-reference/exchanges:
        get:
            summary: List exchanges
            description: Return exchange codes enabled for the authenticated caller.
            operationId: listExchanges
            tags: [validation-reference]
            responses:
                '200':
                    $ref: '#/components/responses/StringList'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/contracts/{exchange_code}:
        get:
            summary: List contracts for an exchange
            operationId: listContracts
            tags: [validation-reference]
            parameters:
                - $ref: '#/components/parameters/ExchangeCode'
            responses:
                '200':
                    $ref: '#/components/responses/StringList'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/contract-type/{exchange_code}/{contract_code}:
        get:
            summary: List contract types
            description: contract_code may be the bare code or the complete value returned by the contracts endpoint.
            operationId: listContractTypes
            tags: [validation-reference]
            parameters:
                - $ref: '#/components/parameters/ExchangeCode'
                - $ref: '#/components/parameters/ContractCode'
            responses:
                '200':
                    $ref: '#/components/responses/StringList'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/expiries/{exchange_code}/{contract_code}/{contract_type}:
        get:
            summary: List contract expiries
            operationId: listContractExpiries
            tags: [validation-reference]
            parameters:
                - $ref: '#/components/parameters/ExchangeCode'
                - $ref: '#/components/parameters/ContractCode'
                - $ref: '#/components/parameters/ContractType'
            responses:
                '200':
                    $ref: '#/components/responses/StringList'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/strikes/{exchange_code}/{contract_code}/{contract_type}/{expiry}:
        get:
            summary: List option strikes
            operationId: listContractStrikes
            tags: [validation-reference]
            parameters:
                - $ref: '#/components/parameters/ExchangeCode'
                - $ref: '#/components/parameters/ContractCode'
                - $ref: '#/components/parameters/ContractType'
                - name: expiry
                  in: path
                  required: true
                  description: An expiry returned by the expiries endpoint.
                  schema:
                      type: string
            responses:
                '200':
                    description: Available strikes in ascending order.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: number
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/fi-reference:
        get:
            summary: Get fixed-income reference values
            description: Return the licensed currency and bond-category values accepted by fixed-income positions.
            operationId: getFixedIncomeReference
            tags: [validation-reference]
            responses:
                '200':
                    $ref: '#/components/responses/ReferenceObject'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/irs-reference:
        get:
            summary: Get cleared-rates reference values
            description: Return accepted clearing houses, directions, currencies, floating-rate indices, and frequencies.
            operationId: getIrsReference
            tags: [validation-reference]
            responses:
                '200':
                    $ref: '#/components/responses/ReferenceObject'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/ladder-reference:
        get:
            summary: Get rates delta-ladder reference values
            description: Return accepted indices and the CME CORE tenor grid.
            operationId: getLadderReference
            tags: [validation-reference]
            responses:
                '200':
                    $ref: '#/components/responses/ReferenceObject'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/fx-symbols:
        get:
            summary: List supported FX currency codes
            description: Return currency codes that can be combined into an FX pair.
            operationId: listFxSymbols
            tags: [validation-reference]
            responses:
                '200':
                    $ref: '#/components/responses/StringList'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /validation-reference/portfolios:
        post:
            summary: Validate a portfolio without calculating it
            description: Strictly validate and standardise positions. Invalid rows are returned as invalid rather than silently substituted.
            operationId: validatePortfolio
            tags: [validation-reference]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PortfolioRequest'
            responses:
                '200':
                    description: Standardised positions with validation fields.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    additionalProperties: true
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/EventMarketNotLicensed'

    /validation-reference/events/search:
        get:
            summary: Search active event markets
            description: This endpoint is available only when the requested event-market exchange is enabled on the caller's licence.
            operationId: searchEventMarkets
            tags: [event-markets]
            parameters:
                - $ref: '#/components/parameters/EventExchange'
                - name: q
                  in: query
                  required: false
                  description: Case-insensitive text or ticker search.
                  schema:
                      type: string
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 30
            responses:
                '200':
                    description: Matching active event markets.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventMarketSearchResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/EventMarketNotLicensed'

    /validation-reference/events/contracts:
        get:
            summary: List active event-market contracts
            description: This endpoint is available only when the requested event-market exchange is enabled on the caller's licence.
            operationId: listEventMarketContracts
            tags: [event-markets]
            parameters:
                - $ref: '#/components/parameters/EventExchange'
            responses:
                '200':
                    description: Up to 200 active event-market contracts.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EventMarketContractsResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/EventMarketNotLicensed'

    /portfolios/stage:
        post:
            summary: Validate and save a portfolio stage
            description: |
                Save one tabular loader section for the authenticated caller. For an ETD
                What-If comparison, each row is ordered as line ID, account code, exchange,
                contract, type, expiry, strike, net position, and account type.
            operationId: stagePortfolio
            tags: [what-if]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StagePortfolioRequest'
            responses:
                '200':
                    description: The validated rows saved to the caller's stage.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StagePortfolioResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'

    /portfolios/stage/submit:
        post:
            summary: Compare a staged portfolio with a stored calculation
            description: Calculate the caller's current stage synchronously and compare it with one visible baseline portfolio.
            operationId: submitWhatIf
            tags: [what-if]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WhatIfRequest'
            responses:
                '200':
                    description: Before and after comparison. Fields ending in _1 are baseline values and fields ending in _2 are staged values.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WhatIfResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    description: The caller cannot view the baseline portfolio.
                '409':
                    description: The baseline result is no longer available. Submit it again before comparing.

components:
    parameters:
        ExchangeCode:
            name: exchange_code
            in: path
            required: true
            description: Exchange code returned by the exchanges endpoint.
            schema:
                type: string
        ContractCode:
            name: contract_code
            in: path
            required: true
            description: Contract code, URL encoded when it contains spaces or punctuation.
            schema:
                type: string
        ContractType:
            name: contract_type
            in: path
            required: true
            description: Contract type returned by the contract-type endpoint.
            schema:
                type: string
        EventExchange:
            name: exchange
            in: query
            required: false
            description: Licensed event-market exchange. Defaults to KALSHI.
            schema:
                type: string
                enum: [KALSHI, FORECASTEX]
                default: KALSHI

    schemas:
        PortfolioRequest:
            description: Top-level request payload for portfolio margin calculations.
            type: object
            required:
                - portfolio
            properties:
                calculation_type:
                    description: |
                        Calculation modes. Combine with commas (e.g. `margins,analytics`).
                    type: string
                    pattern: '^(all|margins|analytics|simm)(,(margins|analytics|simm))*$'
                    default: all
                    example: margins
                vendor_symbology:
                    description: Symbology format for position codes.
                    type: string
                    enum: [clearing, ion, gmi, tt_new]
                    default: clearing
                    example: clearing
                cme_symbology:
                    description: CME-specific symbology format.
                    type: string
                    enum: [clearing, globex]
                    default: clearing
                    example: clearing
                currency_code:
                    description: Base currency for aggregated multi-currency results (ISO 4217).
                    type: string
                    enum: [USD, EUR, GBP, JPY, CHF, AUD, CAD, BRL, CNH, HKD, INR, NZD]
                    default: USD
                    example: USD
                use_closest_match:
                    description: Auto-correct minor errors in expiry or strike by matching to the nearest valid contract.
                    type: boolean
                    default: true
                    example: true
                use_closest_active:
                    description: Use the closest active contract when the exact match is not available.
                    type: boolean
                    default: true
                bdate:
                    description: Calculation date (`YYYYMMDD`). Defaults to previous business day.
                    type: integer
                    example: 20250107
                price_date:
                    description: Price date (`YYYYMMDD`). Defaults to previous business day.
                    type: integer
                    example: 20250107
                cycle_code:
                    description: Exchange cycle code.
                    type: string
                request_id:
                    description: User-defined UUID to track the request. Auto-generated if omitted.
                    type: string
                    format: uuid
                    example: '5c09862d-8d69-0f8d-821b-47762ef06a6f'
                memo:
                    description: Free-text memo attached to the request.
                    type: string
                pnl_details:
                    description: Cache the full historical P&L vector for downstream analysis.
                    type: boolean
                    default: false
                in_memory:
                    description: Process the request in-memory without persisting results.
                    type: boolean
                    default: false
                is_live:
                    description: Mark this as a live portfolio.
                    type: boolean
                    default: true
                risk_free_rate:
                    description: Optional portfolio-wide analytics override. When omitted, validated ETD options use their maturity-matched validation rate; positions without one fall back to 0.01.
                    type: number
                free_risk_rate:
                    description: Deprecated spelling of risk_free_rate, accepted until 2026-12-05.
                    type: number
                    deprecated: true
                stress_test_enabled:
                    description: Enable stress testing on the portfolio.
                    type: boolean
                    default: false
                stress_test_details_enabled:
                    description: Include detailed stress test drill-down.
                    type: boolean
                    default: false
                position_limits_enabled:
                    description: Enable position limit checks.
                    type: boolean
                    default: false
                pricing:
                    description: Pricing configuration.
                    type: object
                    properties:
                        enabled:
                            type: boolean
                            default: false
                fx_margin_parameters:
                    description: FX margin rate overrides, keyed by currency pair (e.g. `EUR_USD`).
                    type: object
                    additionalProperties:
                        type: number
                risk_metrics:
                    $ref: '#/components/schemas/RiskMetrics'
                simm_metrics:
                    $ref: '#/components/schemas/SimmMetrics'
                stress_sensitivities:
                    $ref: '#/components/schemas/StressSensitivities'
                portfolio:
                    description: Array of supported ETD, Fixed Income, FX, FI by CUSIP, CRIF, event, cleared IRS, and rates delta-ladder positions.
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/ETDPosition'
                            - $ref: '#/components/schemas/BondPosition'
                            - $ref: '#/components/schemas/FXPosition'
                            - $ref: '#/components/schemas/CUSIPPosition'
                            - $ref: '#/components/schemas/CRIFPosition'
                            - $ref: '#/components/schemas/EventMarketPosition'
                            - $ref: '#/components/schemas/IRSPosition'
                            - $ref: '#/components/schemas/DeltaLadderPosition'
            additionalProperties: true

        RiskMetrics:
            description: Analytics configuration. Used when `calculation_type` includes `analytics`.
            type: object
            properties:
                lookback:
                    description: Historical lookback period in business days.
                    type: integer
                    default: 250
                    example: 250
                ci:
                    description: Confidence interval percentage (e.g. 99 for 99%).
                    type: number
                    default: 99
                    example: 99
                method:
                    description: Risk calculation method.
                    type: string
                    enum: [value-at-risk, expected-shortfall]
                    default: value-at-risk
                    example: value-at-risk
                mpor:
                    description: Margin period of risk in days.
                    type: integer
                    default: 1
                    example: 1
                mode:
                    description: Returns mode.
                    type: string
                    enum: [absolute, relative]
                    default: absolute
                    example: absolute
                option_pnl_method:
                    description: >-
                        How a vanilla option's historical P&L is built. `delta` scales each
                        historical move of the underlying by today's delta. `historical-revaluation`
                        reprices today's option under each date's historical underlying and
                        implied-volatility move, so gamma and vega count; an option without a usable
                        volatility history keeps the delta approximation and is listed in the
                        response's `option_pnl_provenance`.
                    type: string
                    enum: [delta, historical-revaluation]
                    default: delta
                    example: delta
                bond_pricing_version:
                    description: Bond pricing model version.
                    type: integer
                    default: 1
                    example: 1
                bond_use_continuous_compounding:
                    description: Use continuous compounding (`true`) or annual compounding (`false`).
                    type: boolean
                    default: true
                    example: true
            additionalProperties: true

        SimmMetrics:
            description: ISDA SIMM configuration. Used when `calculation_type` includes `simm`.
            type: object
            properties:
                version:
                    description: SIMM version with underscores (e.g. `2_6_5` for v2.6.5).
                    type: string
                    example: '2_6_5'
                holding_period:
                    description: Holding period in days.
                    type: integer
                    enum: [1, 10]
                    default: 10
                    example: 10
            additionalProperties: true

        StressSensitivities:
            description: Stress scenario configuration. Used when `calculation_type` includes `analytics`.
            type: object
            properties:
                underlying_shocks:
                    description: Shocks applied to the underlying price.
                    type: array
                    items:
                        type: number
                    default: [-4, -3, -2, -1, 1, 2, 3, 4]
                    example: [-4, -3, -2, -1, 1, 2, 3, 4]
                volatility_shocks:
                    description: Corresponding volatility shocks (same length as `underlying_shocks`).
                    type: array
                    items:
                        type: number
                    default: [-0.8, -0.5, -0.3, -0.1, 0.1, 0.3, 0.5, 0.8]
                    example: [-0.8, -0.5, -0.3, -0.1, 0.1, 0.3, 0.5, 0.8]
                shock_type:
                    description: Shock interpretation.
                    type: string
                    enum: [absolute, relative]
                    default: absolute
                use_std_dev:
                    description: Scale shocks by standard deviation.
                    type: boolean
                    default: true
                std_dev_lookback:
                    description: Lookback period for standard deviation calculation.
                    type: integer
                    default: 2500
                std_dev_mpor:
                    description: Margin period of risk for standard deviation scaling.
                    type: integer
                    default: 1
                generate_full_report:
                    description: Generate a full stress test report.
                    type: boolean
                    default: false
            additionalProperties: true

        ETDPosition:
            description: Exchange-Traded Derivative position (futures and options).
            type: object
            required:
                - account_code
                - exchange_code
                - contract_code
                - contract_type
                - net_position
            properties:
                account_code:
                    description: Internal account identifier.
                    type: string
                    example: Account 001
                account_name:
                    description: Display name for the account.
                    type: string
                sub_account_code:
                    description: Sub-account identifier.
                    type: string
                sub_account_name:
                    description: Sub-account display name.
                    type: string
                exchange_code:
                    description: Exchange acronym (e.g. `NYMEX`, `ICE.EU`, `EUREX`, `ASX`).
                    type: string
                    example: ICE.EU
                contract_code:
                    description: Contract symbol (e.g. `CL`, `B`, `FDAX`).
                    type: string
                    example: B
                contract_type:
                    description: '`FUT` / `F` / `Future` for futures, `CALL` for call options, `PUT` for put options, `CASH` for a cash contract (a single stock, ETF or index).'
                    type: string
                    example: FUT
                contract_expiry:
                    description: Expiry date. Accepts `YYYYMM`, `YYYYMMDD`, or `MMM-YY` formats. Omit for a cash contract, which has none.
                    type: string
                    example: '202512'
                contract_strike:
                    description: Option strike price. Required for CALL/PUT, omit for futures.
                    type: string
                    default: ''
                net_position:
                    description: Position size (positive = long, negative = short).
                    oneOf:
                        - type: string
                        - type: number
                    example: '1000'
                account_type:
                    description: Margin account classification. At OCC, REGT selects strategy-based Reg T and C selects customer TIMS portfolio margin.
                    type: string
                    enum: [H, S, M, HRP, NHRP, C, REGT]
                    default: H
                    example: H
                cross_margin:
                    description: Elect an eligible CME listed-rates future for cross-margin optimization.
                    type: boolean
                cross_margin_dv01:
                    description: Optional per-lot DV01 override used by the optimizer.
                    oneOf:
                        - type: string
                        - type: number
                cross_margin_tenor:
                    description: Optional cleared-rates tenor override used by the optimizer.
                    oneOf:
                        - type: string
                        - type: number
                omnibus_ind:
                    description: Omnibus indicator.
                    type: string
                position_id:
                    description: External position identifier.
                    type: string
                long_qty:
                    description: Long quantity.
                    oneOf:
                        - type: string
                        - type: number
                short_qty:
                    description: Short quantity.
                    oneOf:
                        - type: string
                        - type: number
                sod_qty:
                    description: Start-of-day quantity.
                    oneOf:
                        - type: string
                        - type: number
                open_qty:
                    description: Open quantity.
                    oneOf:
                        - type: string
                        - type: number
                close_qty:
                    description: Close quantity.
                    oneOf:
                        - type: string
                        - type: number
                avg_buy:
                    description: Average buy price.
                    oneOf:
                        - type: string
                        - type: number
                avg_sell:
                    description: Average sell price.
                    oneOf:
                        - type: string
                        - type: number
                itd_volume:
                    description: Intraday traded volume.
                    oneOf:
                        - type: string
                        - type: number
            additionalProperties: true

        BondPosition:
            description: Fixed income (bond) position.
            type: object
            required:
                - account_code
                - maturity
                - notional
            properties:
                account_code:
                    description: Internal account identifier.
                    type: string
                    example: Account 002
                currency:
                    description: Bond currency (ISO 4217).
                    type: string
                    example: USD
                contract_type:
                    description: Typically `BOND`. Use `UST` for FICC-eligible USD Treasuries.
                    type: string
                    example: BOND
                maturity:
                    description: Maturity date (`YYYYMMDD`).
                    type: string
                    example: '20461021'
                coupon_rate:
                    description: Annual coupon rate as a percentage.
                    oneOf:
                        - type: string
                        - type: number
                    example: 6
                coupon_frequency:
                    description: Coupon payments per year (e.g. `2` for semi-annual).
                    oneOf:
                        - type: string
                        - type: number
                    example: 2
                notional:
                    description: Face value (positive = long, negative = short).
                    oneOf:
                        - type: string
                        - type: number
                    example: 1000000
            additionalProperties: true

        EventMarketPosition:
            description: Binary event-market position.
            type: object
            required:
                - account_code
                - ticker
            allOf:
                - anyOf:
                    - type: object
                      required:
                          - market_type
                      properties:
                          market_type:
                              type: string
                    - type: object
                      required:
                          - exchange_code
                      properties:
                          exchange_code:
                              type: string
                - anyOf:
                    - type: object
                      required:
                          - side
                          - quantity
                      properties:
                          side:
                              type: string
                          quantity:
                              type: number
                    - type: object
                      required:
                          - net_position
                      properties:
                          net_position:
                              type: number
            properties:
                account_code:
                    type: string
                    example: EVENT_ACCOUNT
                market_type:
                    description: Set this to EVENT when exchange_code is omitted. At least one venue signal is required.
                    type: string
                    enum: [EVENT]
                    example: EVENT
                exchange_code:
                    description: Event exchange. At least one of exchange_code or market_type is required.
                    type: string
                    enum: [KALSHI, FORECASTEX]
                    example: KALSHI
                ticker:
                    description: Exchange event ticker.
                    type: string
                side:
                    description: Contract side when quantity is used.
                    type: string
                    enum: [YES, NO]
                quantity:
                    description: Contract quantity used with side. At least one of quantity or net_position is required.
                    type: number
                net_position:
                    description: Signed contracts, positive for yes and negative for no. At least one of net_position or quantity is required.
                    type: number
                price_dollars:
                    description: Optional event mark in dollars between 0 and 1.
                    type: number
                    minimum: 0
                    maximum: 1
                netting_enabled:
                    type: boolean
                currency_code:
                    type: string
                    example: USD
            additionalProperties: true

        IRSPosition:
            description: Trade-level cleared interest-rate swap.
            type: object
            required:
                - account_code
                - clearing_house
                - direction
                - notional
                - effective_date
                - maturity_date
                - fixed_rate
                - float_index
            properties:
                account_code:
                    type: string
                    example: CME_RATES_IRS
                clearing_house:
                    type: string
                    example: CME
                trade_id:
                    type: string
                type:
                    type: string
                    enum: [VANILLA, OIS, ZERO_COUPON, BASIS, FRA]
                direction:
                    type: string
                    enum: [PAY, RECEIVE]
                notional:
                    type: number
                currency:
                    type: string
                    example: USD
                effective_date:
                    description: Effective date in YYYYMMDD format.
                    type: string
                maturity_date:
                    description: Maturity date in YYYYMMDD format.
                    type: string
                fixed_rate:
                    description: Fixed rate as a percentage, for example 3.5 for 3.5 percent.
                    type: number
                float_index:
                    type: string
                    example: USD-SOFR-COMPOUND
                pay_frequency:
                    type: string
                    example: 6M
            additionalProperties: true

        DeltaLadderPosition:
            description: Signed cleared-rates DV01 exposure for one curve and tenor bucket.
            type: object
            required:
                - account_code
                - index
                - tenor
                - dv01
            properties:
                account_code:
                    type: string
                    example: CME_RATES_LADDER
                index:
                    type: string
                    example: USD_SOFR_1D_ERS
                tenor:
                    description: Bucket tenor as a day count.
                    type: string
                    example: 1826D
                dv01:
                    description: Signed currency amount per basis point.
                    type: number
                    example: 78000
            additionalProperties: true

        FXPosition:
            description: Foreign exchange position.
            type: object
            required:
                - account_code
                - currency_pair
                - contract_type
                - expiry
                - amount
            properties:
                account_code:
                    description: Internal account identifier.
                    type: string
                    example: Account 003
                currency_pair:
                    description: Currency pair (e.g. `EUR_USD`, `GBP_JPY`).
                    type: string
                    example: EUR_USD
                contract_type:
                    description: Contract type.
                    type: string
                    enum: [FX]
                expiry:
                    description: Expiry date.
                    type: string
                    example: '20271231'
                amount:
                    description: Notional amount (positive = long, negative = short).
                    type: number
                    example: 5000000
            additionalProperties: true

        CUSIPPosition:
            description: Fixed income position identified by CUSIP.
            type: object
            required:
                - account_code
                - cusip
                - notional
            properties:
                account_code:
                    description: Internal account identifier.
                    type: string
                    example: Account 004
                cusip:
                    description: CUSIP identifier.
                    type: string
                    example: '912828ZT6'
                notional:
                    description: Face value (positive = long, negative = short).
                    oneOf:
                        - type: string
                        - type: number
                    example: 1000000
            additionalProperties: true

        CRIFPosition:
            description: ISDA CRIF position for SIMM margin calculations.
            type: object
            required:
                - account_code
                - product_class
                - risk_type
                - qualifier
                - bucket
                - label1
                - label2
            properties:
                account_code:
                    description: Internal account identifier.
                    type: string
                    example: Fund ABC
                im_model:
                    description: Initial margin model. Set to `SIMM`.
                    type: string
                    example: SIMM
                product_class:
                    description: ISDA product class.
                    type: string
                    example: RatesFX
                risk_type:
                    description: ISDA risk type (e.g. `Risk_IRCurve`, `Risk_FX`, `Risk_CreditQ`).
                    type: string
                    example: Risk_IRCurve
                qualifier:
                    description: Risk qualifier (e.g. currency code or issuer).
                    type: string
                    example: USD
                bucket:
                    description: ISDA bucket identifier.
                    type: string
                    example: '1'
                label1:
                    description: Tenor or maturity label (e.g. `15Y`, `30Y`).
                    type: string
                    example: 15Y
                label2:
                    description: Sub-curve label (e.g. `OIS`, `Libor3m`).
                    type: string
                    example: OIS
                amount_usd:
                    description: Sensitivity amount in USD.
                    type: number
                    example: 1000000
                amount:
                    description: Sensitivity amount in local currency.
                    type: number
                amount_currency:
                    description: Currency of the `amount` field (ISO 4217).
                    type: string
                trade_id:
                    description: Trade identifier.
                    type: string
                valuation_date:
                    description: Valuation date (`DD/MM/YYYY`).
                    type: string
                end_date:
                    description: End date (`DD/MM/YYYY`).
                    type: string
                collect_regulations:
                    description: Comma-separated regulation codes.
                    type: string
                    example: 'CFTC,ESA'
                post_regulations:
                    description: Comma-separated regulation codes.
                    type: string
                    example: 'NONREG,CFTC,ESA'
            additionalProperties: true

        OptimizerResponse:
            type: object
            properties:
                request_id:
                    type: string
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/OptimizerReport'

        OptimizerReport:
            type: object
            properties:
                account_code:
                    type: string
                price_date:
                    type: integer
                currency_code:
                    type: string
                baseline:
                    $ref: '#/components/schemas/OptimizerTotals'
                all_candidates_to_seq:
                    $ref: '#/components/schemas/OptimizerTotals'
                optimized:
                    $ref: '#/components/schemas/OptimizerTotals'
                legs:
                    type: array
                    items:
                        type: object
                        properties:
                            position_id:
                                type: string
                            contract:
                                type: string
                            contract_code:
                                type: string
                            expiry:
                                type: string
                            net_position:
                                type: number
                            tenor:
                                type: string
                            ladder_dv01:
                                type: number
                            span_allocated:
                                type: number
                            fraction_to_seq:
                                type: number
                            lots_to_seq:
                                type: number
                            lots_left_in_seg:
                                type: number
                            recommendation:
                                type: string
                candidates:
                    type: integer
                moved:
                    type: integer
                exceptions:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                net_ladder:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                parameters:
                    type: array
                    items:
                        type: object
                        additionalProperties: true

        OptimizerTotals:
            type: object
            properties:
                seg_span:
                    description: Margin remaining in the listed model.
                    type: number
                seq_hvar:
                    description: Cleared-rates historical VaR margin.
                    type: number
                total:
                    type: number
                saving:
                    description: Saving relative to baseline when applicable.
                    type: number
                saving_pct:
                    description: Percentage saving relative to baseline when applicable.
                    type: number

        AccountResult:
            description: Margin results and drill-down for a single account.
            type: object
            properties:
                request_id:
                    type: string
                    example: '5c09862d8d690f8d821b47762ef06a6f'
                portfolio_id:
                    type: string
                    example: 'ca6b921c04f6afa9e35608d61a0223b3'
                username:
                    type: string
                    example: 'user@cumulus9.com'
                submitted_time:
                    type: string
                    format: date-time
                account_code:
                    type: string
                    example: Account 001
                status:
                    type: string
                    example: done
                price_date:
                    type: integer
                    example: 20250107
                currency_code:
                    type: string
                    example: USD
                initial_margin:
                    description: Total initial margin requirement.
                    type: number
                    example: 4698720
                gross_margin:
                    description: Gross margin before offsets.
                    type: number
                requirement:
                    description: Net margin requirement.
                    type: number
                gross_requirement:
                    description: Gross margin requirement.
                    type: number
                option_liquidation_value:
                    type: number
                    example: 0
                delivery_margin:
                    description: ICE Clear Europe delivery-margin component in result currency.
                    type: number
                    example: 0
                cvm:
                    description: Contingent variation margin component in result currency.
                    type: number
                    example: 0
                sellers_security:
                    description: Seller's security component in result currency.
                    type: number
                    example: 0
                buyers_security:
                    description: Buyer's security component in result currency.
                    type: number
                    example: 0
                value_at_risk:
                    description: Portfolio VaR (when analytics requested).
                    type: number
                option_pnl_provenance:
                    description: >-
                        How each vanilla option's historical P&L was built under
                        risk_metrics.option_pnl_method. A delta fallback is a priced position, not an
                        error. Absent on results calculated before the field existed.
                    type: object
                    nullable: true
                    properties:
                        requested_method:
                            type: string
                            enum: [delta, historical-revaluation]
                        historical_positions:
                            description: Options repriced from a volatility history, own or proxied.
                            type: integer
                        direct_positions:
                            description: Options repriced from their own volatility history.
                            type: integer
                        proxy_positions:
                            description: Options repriced from a curated proxy's volatility history.
                            type: integer
                        delta_fallback_positions:
                            description: Options that kept the delta approximation.
                            type: integer
                        proxy_contracts:
                            description: Proxied contract id to the contract whose history it used.
                            type: object
                            additionalProperties:
                                type: string
                        fallbacks:
                            type: array
                            items:
                                type: object
                                properties:
                                    position_id:
                                        type: string
                                    contract_id:
                                        type: string
                                    reason:
                                        type: string
                                        enum:
                                            - missing_volatility_history
                                            - insufficient_volatility_history
                                            - invalid_revaluation_input
                vm_at_risk:
                    description: >-
                        Worst expected variation-margin outflow over the margin period of risk at the
                        configured confidence level (the portfolio P&L VaR), in result currency.
                    type: number
                im_at_risk:
                    description: >-
                        Worst expected initial-margin increase over the margin period of risk at the
                        configured confidence level, in result currency, under the methodology selected
                        for the environment. var_scaling (default) and scan_elasticity scale each
                        venue group's margin by a factor derived from that venue's own risk history,
                        holding today's positions fixed; margin_history takes the quantile of the
                        portfolio's own recorded day-over-day margin growth. Null when nothing could
                        be estimated.
                    type: number
                    nullable: true
                stress_im:
                    description: >-
                        The same figure measured under the worst move observed in the window rather
                        than the confidence-level quantile. Always at or above im_at_risk. Null
                        whenever im_at_risk is null, and for the margin_history methodology, which
                        reports no separate worst case.
                    type: number
                    nullable: true
                im_at_risk_basis:
                    description: >-
                        Which methodology produced im_at_risk. "engine_replay_unavailable" means the
                        environment selected engine_replay, which is defined but not implemented, and
                        is reported distinctly so it is not mistaken for a methodology that ran and
                        found nothing. Null when im_at_risk is null.
                    type: string
                    nullable: true
                    enum: [var_scaling, scan_elasticity, margin_history, engine_replay_unavailable, null]
                im_at_risk_breakdown:
                    description: >-
                        Per venue group and currency contribution to im_at_risk. Present only for the
                        var_scaling and scan_elasticity methodologies.
                    type: array
                    nullable: true
                    items:
                        type: object
                        properties:
                            venue_group_code:
                                type: string
                            currency_code:
                                type: string
                            margin:
                                description: Initial margin charged at this venue, in its own currency.
                                type: number
                            im_at_risk:
                                description: Dimensionless scaling factor applied to that margin.
                                type: number
                            im_at_risk_amount:
                                description: margin x im_at_risk, in the venue's own currency.
                                type: number
                            stress_im:
                                type: number
                            stress_im_amount:
                                type: number
                im_at_risk_excluded:
                    description: >-
                        Margin that carries no scaling factor and is therefore NOT included in
                        im_at_risk, listed rather than dropped so the gap is visible. Typically fixed
                        income, FX or any venue with too little history to estimate a factor.
                    type: array
                    nullable: true
                    items:
                        type: object
                        properties:
                            venue_group_code:
                                type: string
                            currency_code:
                                type: string
                            margin:
                                type: number
                            reason:
                                type: string
                stress_loss:
                    description: Worst historical daily loss (when analytics requested).
                    type: number
                dv01:
                    description: Dollar value of a basis point.
                    type: number
                additional_margin:
                    description: Add-on charges, including converted delivery-period components where applicable.
                    type: number
                pnl:
                    type: number
                itd_volume:
                    type: number
                margin_by_ccp:
                    type: array
                    items:
                        $ref: '#/components/schemas/MarginByCCP'
                margin_by_contract:
                    type: array
                    items:
                        $ref: '#/components/schemas/MarginByContract'
                margin_by_span:
                    type: array
                    nullable: true
                    items:
                        $ref: '#/components/schemas/MarginBySpan'
                margin_by_span2:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_eurexpme:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_simm:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_fx:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_jpxvar:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_krx:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_nodal:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_euronextvar:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
                margin_by_irm2_3:
                    type: array
                    nullable: true
                    items:
                        type: object
                        additionalProperties: true
