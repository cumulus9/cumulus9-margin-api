name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python checks
        run: python -m pip install -r python/requirements.txt pytest pyyaml jsonschema

      - name: Lint the canonical OpenAPI contract
        run: npx --yes @redocly/cli@2.51.2 lint open-api-schema.yaml

      - name: Check endpoint coverage, local links, and sample expiries
        run: python scripts/check_docs.py

      - name: Check Python examples
        run: |
          python -m compileall -q python
          python -m pytest -q python/tests

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Check JavaScript examples
        working-directory: javascript
        run: |
          npm ci
          for file in *.js; do node --check "$file"; done

      - name: Check cURL examples
        run: for file in curl/*.sh; do bash -n "$file"; done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check C# example
        run: dotnet build csharp/csharp.csproj --configuration Release

      - uses: r-lib/actions/setup-r@v2

      - name: Check R example syntax
        run: Rscript -e "parse(file='r/00_simple_margin_calculation.r')"

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude '^https://www\.cmegroup\.com/notices/clearing/2020/10/Chadv20-404\.pdf$'
            README.md
          fail: true
